server {
    listen 80;
    root /usr/share/nginx/html;

    # Project binaries can be large (imported models and textures).
    client_max_body_size 1024m;

    # Sync API and authentication; the service name comes from docker-compose.yml.
    location /api/ {
        proxy_pass http://server:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Stream uploads instead of buffering them completely on disk.
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # The SPA shell must not be cached: asset file names change on every build, so a cached
    # index.html would point at removed files and leave the page blank.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # Katalog (Modelle, Symbole, Texturen) und gebaute Assets lange cachen
    location /catalog/ {
        add_header Cache-Control "public, max-age=86400";
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Single-Page-App: /editor/... liefert index.html
    location / {
        try_files $uri /index.html;
    }
}
